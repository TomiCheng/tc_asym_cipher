[package]
name = "tc_rsa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RSA after Bouncy Castle: key pair generation, blinding and the RSA operation as an asymmetric block cipher, over fixed-width, padded and RustCrypto engines."
readme = "README.md"
documentation = "https://docs.rs/tc_rsa"
keywords = ["rsa", "public-key", "blinding", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "benches/**", "README.md", "BENCHES.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["alloc"]
alloc = ["tc_bigint/alloc", "tc_modular/alloc", "tc_prime/alloc"]
rustcrypto = ["alloc", "dep:rsa", "dep:zeroize"]

[dependencies]
num-traits = { version = "0.2.19", default-features = false }
rand_core = { version = "0.10.1", default-features = false }
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["hazmat"], optional = true }
tc_asym_cipher = { version = "0.1.0", path = "../tc_asym_cipher" }
tc_zeroize = "0.1.0"
tc_bigint = { version = "0.1.0", features = ["rand_core"] }
tc_modular = "0.1.0"
tc_prime = "0.1.0"
zeroize = { version = "1.8", default-features = false, optional = true }

[dev-dependencies]
criterion = "0.8.2"
rand = "0.10.3"

[[bench]]
name = "rsa2048"
harness = false
required-features = ["rustcrypto"]
