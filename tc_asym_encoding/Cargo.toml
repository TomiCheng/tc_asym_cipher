[package]
name = "tc_asym_encoding"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Encodings over asymmetric block ciphers: PKCS#1 v1.5 and OAEP, after Bouncy Castle's crypto/encodings."
readme = "README.md"
documentation = "https://docs.rs/tc_asym_encoding"
keywords = ["oaep", "pkcs1", "rsa", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rand_core = "0.10.1"
tc_digest = "0.1.0"
tc_asym_cipher = { version = "0.1.0", path = "../tc_asym_cipher" }
tc_zeroize = { version = "0.1.0", features = ["alloc"] }

[dev-dependencies]
rand = "0.10.3"
tc_bigint = "0.1.0"
tc_rsa = { version = "0.1.0", path = "../tc_rsa", features = ["alloc"] }
tc_sha = "0.1.1"
