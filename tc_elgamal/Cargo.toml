[package]
name = "tc_elgamal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ElGamal encryption over a Diffie-Hellman group, with its keys and key pair and group generation, after Bouncy Castle."
readme = "README.md"
documentation = "https://docs.rs/tc_elgamal"
keywords = ["elgamal", "encryption", "asymmetric", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[dependencies]
rand_core = { version = "0.10.1", default-features = false }
tc_asym_cipher = { version = "0.2.0", path = "../tc_asym_cipher" }
tc_bigint = { version = "0.1.0", features = ["alloc", "rand_core"] }
tc_dh_key = { version = "0.1.0", path = "../tc_dh_key" }
tc_modular = { version = "0.1.0", features = ["alloc"] }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = "0.10.3"
tc_asym_encoding = { version = "0.2.0", path = "../tc_asym_encoding" }
